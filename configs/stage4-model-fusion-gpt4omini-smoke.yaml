profile_name: full_local_v1_gpt4omini_smoke
sentence_bert:
  required: true
  enabled: true
  model_dir: Sentence-BERT/all-mpnet-base-v2
  device: cuda:1
bertscore:
  required: false
  enabled: true
  model_dir: models/bertscore/roberta-large
  device: cuda:1
clip:
  required: true
  enabled: true
  model_dir: CLIP
  device: cuda:1
blip_itm:
  required: true
  enabled: true
  model_dir: blip-itm-large-coco
  device: cuda:1
gpt4omini_judge:
  required: true
  model_config: configs/openai-gpt4o-mini-judge.yaml
  timeout_seconds: 30
  max_retries: 0
  retry_backoff_seconds: 1.0
