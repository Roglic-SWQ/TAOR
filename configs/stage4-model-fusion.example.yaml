profile_name: full_local_v1
sentence_bert:
  required: true
  enabled: true
  model_dir: Sentence-BERT/all-mpnet-base-v2
  device: cpu
bertscore:
  required: false
  enabled: true
  model_dir: models/bertscore/roberta-large
  device: cpu
clip:
  required: true
  enabled: true
  model_dir: CLIP
  device: cpu
blip_itm:
  required: true
  enabled: true
  model_dir: blip-itm-large-coco
  device: cpu
gpt4omini_judge:
  required: true
  max_concurrency: 10
  model_config: configs/openai-gpt4o-mini-judge.yaml
  timeout_seconds: 120
  max_retries: 1
  retry_backoff_seconds: 1.0
